name: macOS validation (manual)
on:
  workflow_dispatch:
concurrency:
  group: macos-manual-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:storage
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build WKWebView test application
        run: npm run tauri -- build --debug --features e2e-embedded --no-bundle
      - name: Native E2E (macOS)
        run: npm run test:e2e
