name: Publish verified production release (separate human approval)

on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Reviewed full main commit containing pinned verified artifacts and publication approval
        required: true
        type: string

permissions: {}

concurrency:
  group: production-release-publication
  cancel-in-progress: false

env:
  EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}

jobs:
  prepare:
    if: github.repository == 'shimi-lynx/mogledge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.validated.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/release/
            /scripts/signing/
          sparse-checkout-cone-mode: false
      - name: Build independent public-key verifier
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --locked --release --manifest-path scripts/signing/verifier/Cargo.toml --target-dir "$RUNNER_TEMP/verifier" --jobs 1
      - name: Verify pinned production output and exact public assets before approval
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/release.py publication-prepare "$RUNNER_TEMP/verifier/release/mogledge-signature-verifier" "$RUNNER_TEMP/reviewed-publication"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-publication-0.8.2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-publication/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/release/
            /scripts/signing/
          sparse-checkout-cone-mode: false
      - name: Build trusted public-key verifier without Secrets
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --locked --release --manifest-path scripts/signing/verifier/Cargo.toml --target-dir "$RUNNER_TEMP/verifier" --jobs 1
      - name: Revalidate approved exact assets, stage a draft, then publish without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py publish "$RUNNER_TEMP/verifier/release/mogledge-signature-verifier" "$RUNNER_TEMP/publication"
