[package]
name = "my-knowledge-backend-tests"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.99"

# Compile the production source modules without Tauri's platform WebView stack.
# Keep dependency versions/features aligned with src-tauri/Cargo.toml.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
axum = "0.8"
http-body = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time"] }
notify = "8"
rand = "0.9"
percent-encoding = "2"
cap-std = "3"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
html5ever = "0.39.0"
unicode-normalization = "0.1.25"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
] }

[[bin]]
name = "storage-identity-cli"
path = "src/bin/storage-identity-cli.rs"

[[bin]]
name = "knowledge-cli"
path = "src/bin/knowledge-cli.rs"

[[bin]]
name = "state-inspection-cli"
path = "src/bin/state-inspection-cli.rs"

[[bin]]
name = "state-transfer-cli"
path = "src/bin/state-transfer-cli.rs"

[features]
# Match ordinary product builds; enabled() remains macOS-only.
macos-persistent-storage = []
default = ["macos-persistent-storage"]
e2e = []
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
